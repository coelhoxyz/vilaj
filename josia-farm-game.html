        .tree { background: linear-gradient(90deg, #10b981, #059669); }

        .indicator-value { font-weight: 700; font-size: 1em; }
        .indicator-desc { font-size: 0.7em; color: #6b7280; margin-top: 3px; }

        .msg-text { color: #1e1b4b; font-size: 0.95em; line-height: 1.5; }

        .culture-needs { font-size: 0.75em; color: #6b7280; margin: 8px 0; text-align: left; padding: 6px; background: white; border-radius: 6px; }

    </style>

        function update() {
            var moneyPct = Math.min(Math.max(game.money, 0), 100);
            var treePct = Math.min(Math.max(game.tree, 0), 100);
            var prestigePct = Math.min(Math.max(game.prestige, 0), 100);
            
            document.getElementById('money').style.width = moneyPct + '%';
            document.getElementById('money').textContent = Math.round(game.money);
            document.getElementById('tree').style.width = treePct + '%';
            document.getElementById('tree').textContent = Math.round(game.tree);
            document.getElementById('prestige').style.width = prestigePct + '%';
            document.getElementById('prestige').textContent = Math.round(game.prestige);
            var s = seasons[game.season];
            document.getElementById('season').textContent = s.icon + ' ' + s.name + ' ' + game.year + ' - Trimestre ' + game.trimester + '/40';
            updateIndicators();
        }

        function plant(key) {
            var c = cultures[key];
            game.activeCrops.push({ type: key, name: c.name, icon: c.icon, progress: 0, duration: c.duration, profit: c.profit });
            triggerEvent();
        }

        function triggerEvent() {
            var availableEvents = events.filter(function(e) { 
                return game.usedEvents.indexOf(e.id) === -1; 
            });
            
            if (availableEvents.length === 0) {
                game.usedEvents = [];
                availableEvents = events;
            }
            
            var randomEvent = availableEvents[Math.floor(Math.random() * availableEvents.length)];
            game.usedEvents.push(randomEvent.id);
            showEvent(randomEvent);
        }

        function showTrimesterResults() {
            var data = getCurrentData();
            var html = '<div class="message"><div class="msg-name">JosIA</div><div class="msg-text">📋 Resultados do Trimestre ' + game.trimester + '</div></div>';
            
            if (game.activeCrops.length === 0) {
                html += '<div class="result-card"><div class="result-title">⚠️ Nenhum cultivo ativo</div><div class="msg-text">Você não plantou nada neste trimestre.</div></div>';
            }
            
            html += '<div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;">';
            
            for (var i = 0; i < game.activeCrops.length; i++) {
                var crop = game.activeCrops[i];
                crop.progress++;
                var progressPct = (crop.progress / crop.duration * 100).toFixed(0);
                var c = cultures[crop.type];
                var d = getCurrentData();
                var compatibility = 0;
                
                if (d.temp >= c.needs.temp[0] && d.temp <= c.needs.temp[1]) { compatibility += 1; }
                if (d.rain >= c.needs.rain[0] && d.rain <= c.needs.rain[1]) { compatibility += 1; }
                if (d.humidity >= c.needs.humidity[0] && d.humidity <= c.needs.humidity[1]) { compatibility += 1; }
                if (d.soil >= c.needs.soil[0] && d.soil <= c.needs.soil[1]) { compatibility += 1; }
                if (d.radiation >= c.needs.radiation[0] && d.radiation <= c.needs.radiation[1]) { compatibility += 1; }
                if (d.ndvi >= c.needs.ndvi[0] && d.ndvi <= c.needs.ndvi[1]) { compatibility += 1; }
                
                var compatibilityPct = Math.round((compatibility / 6) * 100);
                
                var growthImpact = (compatibilityPct / 100 * 5).toFixed(1);
                game.tree += parseFloat(growthImpact);
                
                html += '<div class="result-card">';
                html += '<div class="result-title">';
                html += '<span>' + crop.icon + ' ' + crop.name + '</span>';
                html += '<div class="result-progress-container">';
                html += '<div class="progress-label">Desenvolvimento</div>';
                html += '<div class="progress-bar"><div class="progress-fill" style="width:' + progressPct + '%">' + progressPct + '%</div></div>';
                html += '</div>';
                html += '</div>';
                html += '<div class="result-grid">';
                html += '<div class="result-item"><div class="result-label">Compatibilidade</div><div class="result-value ' + (compatibilityPct >= 75 ? 'positive' : 'negative') + '">' + compatibilityPct + '%</div></div>';
                html += '<div class="result-item"><div class="result-label">Crescimento</div><div class="result-value positive">+' + growthImpact + ' 🌳</div></div>';
                html += '</div>';
                
                if (crop.progress >= crop.duration) {
                    var damageReduction = crop.damage ? (crop.damage / 100) : 0;
                    var finalProfit = Math.round(crop.profit * (compatibilityPct / 100) * (1 - damageReduction));
                    game.money += finalProfit;
                    game.prestige += Math.round(compatibilityPct / 20);
                    
                    var harvestMsg = '✅ Colheita completa! +' + finalProfit + ' 💰, +' + Math.round(compatibilityPct / 20) + ' ⭐';
                    if (crop.damage) {
                        harvestMsg += '<br><small>⚠️ Produção reduzida em ' + crop.damage + '% por eventos</small>';
                    }
                    html += '<div style="background:#d1fae5;padding:10px;border-radius:8px;margin-top:10px;color:#065f46;font-weight:600;">' + harvestMsg + '</div>';
                    game.activeCrops.splice(i, 1);
                    i--;
                }
                html += '</div>';
            }
            
            html += '</div>';
            
            html += '<button class="btn" onclick="nextTrimester()">Próximo Trimestre →</button>';
            show(html);
            update();
        }

        function nextTrimester() {
            game.trimester++;
            game.season++;
            if (game.season >= 4) {
                game.season = 0;
                game.year++;
            }
            
            if (game.trimester > 40) {
                endGame();
                return;
            }
            
            update();
            plantMenu();
        }

        function endGame() {
            var finalScore = Math.round((game.money + game.tree + game.prestige) / 3);
            var rating = '';
            if (finalScore >= 80) rating = '🏆 Excelente!';
            else if (finalScore >= 60) rating = '🥈 Muito Bom!';
            else if (finalScore >= 40) rating = '🥉 Bom!';
            else rating = '📈 Continue praticando!';
            
            show('<div class="message"><div class="msg-name">JosIA</div><div class="msg-text"><h2>🎉 Jornada Completa!</h2><p>10 anos (2015-2025) gerenciados!</p><br><p><strong>Pontuação: ' + finalScore + '/100</strong></p><p>' + rating + '</p><br><p>💰 Dinheiro: ' + Math.round(game.money) + '</p><p>🌳 Sustentabilidade: ' + Math.round(game.tree) + '</p><p>⭐ Prestígio: ' + Math.round(game.prestige) + '</p></div></div><button class="btn" onclick="location.reload()">🌱 Nova Jornada</button>');
        }

        update();
        intro();
    </script>
</body>
</html>
